<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angad Bhargav, CS180 Project 0</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black">
  <div class="max-w-4xl mx-auto px-6 py-10">

    <h1 class="text-2xl font-bold">Angad Bhargav</h1>
    <p class="mt-1 text-base text-neutral-600">Project 0: Becoming Friends with Your Camera</p>

    <h2 class="mt-8 text-base font-semibold">Part 1: Selfie: The Wrong Way vs. The Right Way</h2>
    <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
      <figure>
        <img src="photos/proj0/pt1/closest.png" alt="" class="w-full aspect-[3/4] object-cover">
        <figcaption class="mt-1 text-sm text-neutral-400">way too close</figcaption>
      </figure>
      <figure>
        <img src="photos/proj0/pt1/less-close.png" alt="" class="w-full aspect-[3/4] object-cover">
        <figcaption class="mt-1 text-sm text-neutral-400">still too close</figcaption>
      </figure>
      <figure>
        <img src="photos/proj0/pt1/farther.png" alt="" class="w-full aspect-[3/4] object-cover">
        <figcaption class="mt-1 text-sm text-neutral-400">getting there</figcaption>
      </figure>
      <figure>
        <img src="photos/proj0/pt1/farthest.png" alt="" class="w-full aspect-[3/4] object-cover">
        <figcaption class="mt-1 text-sm text-neutral-400">across the room, zoomed in</figcaption>
      </figure>
    </div>

    <h2 class="mt-10 text-base font-semibold">Part 2: Architectural Perspective Compression</h2>
    <div class="mt-3 grid grid-cols-2 gap-2">
      <figure>
        <img src="photos/proj0/pt2/wheeler-far.png" alt="" class="w-full aspect-[3/4] object-cover">
        <figcaption class="mt-1 text-sm text-neutral-400">zoomed in from back by the light post</figcaption>
      </figure>
      <figure>
        <img src="photos/proj0/pt2/wheeler-close.png" alt="" class="w-full aspect-[3/4] object-cover">
        <figcaption class="mt-1 text-sm text-neutral-400">walked up to the steps, no zoom</figcaption>
      </figure>
    </div>

    <h2 class="mt-10 text-base font-semibold">Part 3: The Dolly Zoom</h2>
    <figure class="mt-3 max-w-xl">
      <img src="photos/proj0/pt3/final.gif" alt="" class="w-full aspect-square object-cover">
      <figcaption class="mt-1 text-sm text-neutral-400">
        Moleja Boy, from my high school
        <a href="https://millingschem.com/mole-projects/" class="underline hover:text-neutral-600">mole project</a>,
        looking over his kingdom
      </figcaption>
    </figure>

  </div>
</body>
</html>
